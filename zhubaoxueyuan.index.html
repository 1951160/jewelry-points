<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>珠宝学院综合积分管理系统 · 在线版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net.cn/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>
:root{--primary:#7B1FA2;--primary-light:#AB47BC;--primary-dark:#4A148C;--secondary:#9C27B0;--accent1:#B39DDB;--accent2:#673AB7;--accent3:#8E24AA;--white:#FFFFFF;--light:#F7F3FB;--border:#E4D9F0;--text:#2D2438;--text-light:#7E6B92;--boy:#7E57C2;--girl:#EC407A;--radius:16px;--radius-full:1000px}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito','Noto Sans SC',sans-serif;background:var(--light);color:var(--text);line-height:1.6;min-height:100vh}
h1,h2,h3,h4{font-family:'Quicksand','Noto Sans SC',sans-serif;font-weight:800}
.app-container{max-width:1200px;margin:0 auto;padding:20px 10px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:15px;flex-wrap:wrap}
.logo{font-family:'Quicksand',sans-serif;font-size:22px;font-weight:900;color:var(--primary-dark)}
.header-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font-family:'Quicksand',sans-serif;font-weight:700;font-size:14px;padding:8px 16px;border-radius:var(--radius-full);border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:#fff}
.btn-secondary{background:linear-gradient(135deg,var(--secondary) 0%,var(--accent3) 100%);color:#fff}
.btn-danger{background:#E91E63;color:#fff}
.btn-white{background:#fff;color:var(--text);border:2px solid var(--border)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{width:32px;height:32px;padding:0;border-radius:50%}
.card{background:#fff;border-radius:var(--radius);box-shadow:0 4px 15px rgba(74,20,140,.08);margin-bottom:20px;border:2px solid var(--border);overflow:hidden}
.card-header{padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--border);flex-wrap:wrap;gap:10px}
.card-title{font-size:18px;font-weight:800;color:var(--primary-dark)}
.card-body{padding:20px}
.form-group{margin-bottom:12px}
.form-control{width:100%;padding:10px;border:2px solid var(--border);border-radius:8px;font-size:14px;outline:none}
.form-control:focus{border-color:var(--primary-light)}
.student-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px;padding:10px}
.student-card{background:#fff;border-radius:12px;padding:15px;text-align:center;border:2px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.04);position:relative}
.student-card.male{border-color:var(--boy)}.student-card.female{border-color:var(--girl)}
.student-card.has-warning{border-color:#E91E63;background:#FFF0F5}
.student-avatar{width:50px;height:50px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff}
.student-avatar.male{background:var(--boy)}.student-avatar.female{background:var(--girl)}
.student-name{font-weight:800;font-size:16px}
.student-meta{font-size:12px;color:var(--text-light)}
.student-points{margin-top:8px;font-weight:800;color:var(--primary);font-size:20px}
.student-volunteer{margin-top:5px;font-weight:700;color:#2E7D32;font-size:14px;background:#E8F5E9;border-radius:8px;padding:3px 8px;display:inline-block;}
.tabs{display:flex;background:#fff;border-radius:var(--radius) var(--radius) 0 0;border-bottom:3px solid var(--primary);overflow:hidden;margin-bottom:20px}
.tab-btn{flex:1;padding:12px;background:transparent;border:none;font-weight:700;cursor:pointer;color:var(--text-light);font-size:15px}
.tab-btn.active{color:var(--primary);border-bottom:3px solid var(--primary);margin-bottom:-3px;background:#fff}
.tab-content{display:none;}
.tab-content.active{display:block;}
.rank-item{display:flex;align-items:center;padding:12px;border-bottom:1px solid var(--border);background:#fff;border-radius:8px;margin-bottom:8px}
.rank-item:nth-child(1) .rank-num{background:#FFD700;color:#fff}
.rank-item:nth-child(2) .rank-num{background:#C0C0C0;color:#fff}
.rank-item:nth-child(3) .rank-num{background:#CD7F32;color:#fff}
.rank-num{width:26px;height:26px;border-radius:50%;background:var(--light);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px;margin-right:15px;}
.rank-name{flex:1;font-weight:bold;font-size:15px;}
.rank-hours{color:#2E7D32;font-weight:900;font-size:16px;}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;overflow-y:auto}
.modal-content{background:#fff;border-radius:var(--radius);width:90%;max-width:500px;margin:10vh auto}
.modal-header{padding:15px 20px;background:var(--primary);color:#fff;display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:20px}
.close{color:#fff;font-size:24px;cursor:pointer}
.rules-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.rule-option{padding:10px;background:var(--light);border-radius:8px;cursor:pointer;display:flex;justify-content:space-between}
.rule-option:hover{background:var(--border)}
.hidden{display:none!important}
.user-bar{display:flex;align-items:center;gap:10px;background:#fff;padding:6px 14px;border-radius:var(--radius-full);border:2px solid var(--border);font-weight:700;font-size:14px}
.admin-only{display:none!important;}
body.is-admin .admin-only{display:inline-flex!important;}
body.is-admin .admin-only-block{display:block!important;}
</style>
</head>
<body>

<div class="app-container">
  <header class="header">
    <div class="logo">珠宝学院综合积分系统</div>
    <div class="header-controls">
      <div class="user-bar">
        <span id="userRoleText">未登录</span>
        <button id="loginBtn" class="btn btn-sm btn-primary">登录 / 注册</button>
        <button id="logoutBtn" class="btn btn-sm btn-white hidden">退出</button>
      </div>
      <button id="importExcelBtn" class="btn btn-secondary admin-only"><i class="fas fa-file-import"></i> 批量导入</button>
      <input type="file" id="excelFile" class="hidden" accept=".xlsx,.xls">
      <button id="exportDataBtn" class="btn btn-secondary"><i class="fas fa-file-excel"></i> 导出数据</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="students">综合积分与志愿管理</button>
    <button class="tab-btn" data-tab="volunteer">志愿服务时长榜</button>
  </div>
  
  <div id="students" class="tab-content active">
    <div class="card admin-only-block" style="margin-bottom:20px;">
      <div class="card-header"><h2 class="card-title">手动添加学生</h2></div>
      <div class="card-body" style="display:flex;gap:10px;flex-wrap:wrap;">
        <input type="text" id="studentNo" class="form-control" placeholder="学号" style="flex:1;">
        <input type="text" id="studentName" class="form-control" placeholder="姓名" style="flex:1;">
        <select id="studentGender" class="form-control" style="width:100px;">
          <option value="male">男生</option>
          <option value="female">女生</option>
        </select>
        <button id="addStudentBtn" class="btn btn-primary">添加</button>
      </div>
    </div>
    <div class="card">
      <div class="card-body">
        <div id="allStudents" class="student-list"></div>
      </div>
    </div>
  </div>

  <div id="volunteer" class="tab-content">
    <div class="card">
      <div class="card-header"><h2 class="card-title">志愿服务时长排行榜</h2></div>
      <div class="card-body">
        <p style="color:var(--text-light); margin-bottom:15px; font-size:13px;">此榜单仅统计志愿时长，不参与综合积分折算。</p>
        <ul id="volunteerRankList" style="list-style:none;padding:0;"></ul>
      </div>
    </div>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <div class="modal-header"><h3 id="modalTitle">操作</h3><span class="close">&times;</span></div>
    <div class="modal-body" id="modalContent"></div>
  </div>
</div>

<script>
/* ============================================================
 * 1. 你的 Supabase 配置 (保持你原有的就行，不用改)
 * ============================================================ */
const SUPABASE_URL = 'https://yjexkrbxgzqusoojxbke.supabase.co'; // ★ 填入你的 URL
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqZXhrcmJ4Z3pxdXNvb2p4YmtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MjA2MDAsImV4cCI6MjEwODE5NjYwMH0.-loqPcHO_CSJLCt1f1ZFPWCzEqBNABTOwVcN5yRnCdA
'; // ★ 填入你的 Key
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================
 * 全局状态
 * ============================================================ */
let currentUser = null;
let isAdmin = false;
let isAnonymous = false;
let operatorName = '';
let students = [];
let rules = [];

/* ============================================================
 * 登录逻辑 (使用 Supabase 原生 Auth)
 * ============================================================ */
document.getElementById('loginBtn').onclick = () => {
  document.getElementById('modalTitle').textContent = '登录 / 注册';
  document.getElementById('modalContent').innerHTML = `
    <div class="form-group"><input type="text" id="authUser" class="form-control" placeholder="操作人姓名（如：张老师）"></div>
    <div class="form-group"><input type="password" id="authPass" class="form-control" placeholder="密码（至少6位）"></div>
    <div style="display:flex;gap:10px;margin-top:15px;">
      <button class="btn btn-primary" style="flex:1" onclick="doAuth('login')">登录</button>
      <button class="btn btn-secondary" style="flex:1" onclick="doAuth('register')">注册</button>
    </div>
    <p style="text-align:center;margin-top:15px;font-size:12px;color:#888;">管理员请注册后，去 Supabase 后台提权。</p>
  `;
  document.getElementById('modal').style.display = 'block';
};

async function doAuth(mode) {
  const u = document.getElementById('authUser').value.trim();
  const p = document.getElementById('authPass').value;
  if (!u || !p) return alert('请填写姓名和密码');
  const email = `${u.toLowerCase()}@jewelry-points.local`;
  
  try {
    if (mode === 'register') {
      const { data, error } = await sb.auth.signUp({ email, password: p, options: { data: { username: u } } });
      if (error) throw error;
      if (!data.session) return alert('注册成功，请尝试登录。');
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: p });
      if (error) throw error;
    }
    document.getElementById('modal').style.display = 'none';
  } catch (err) {
    alert((mode === 'login' ? '登录' : '注册') + '失败：' + err.message);
  }
}

document.getElementById('logoutBtn').onclick = async () => {
  await sb.auth.signOut();
  location.reload();
};

/* ============================================================
 * 数据加载
 * ============================================================ */
async function loadData() {
  const [rulesRes, stuRes] = await Promise.all([
    sb.from('rules').select('*').order('created_at', { ascending: false }),
    sb.from('students').select('*').order('student_no')
  ]);
  rules = rulesRes.data || [];
  students = stuRes.data || [];
  updateUI();
}

/* ============================================================
 * 计算与渲染
 * ============================================================ */
function getTotalPoints(s) { return 100; } // 因为精简版没拉取历史，暂显示100，如需历史请用完整版
function getVolunteerHours(s) { return Number(s.volunteer_hours) || 0; }

function updateUI() {
  const el = document.getElementById('allStudents');
  el.innerHTML = '';
  if (!students.length) el.innerHTML = '<p style="grid-column:1/-1;text-align:center;">暂无学生</p>';
  
  students.forEach(s => {
    const hours = getVolunteerHours(s);
    const card = document.createElement('div');
    card.className = `student-card ${s.gender}`;
    card.innerHTML = `
      <div class="student-avatar ${s.gender}">${s.name.charAt(0)}</div>
      <div class="student-name">${s.name}</div>
      <div class="student-meta">${s.student_no}</div>
      <div class="student-points">100.00 分</div>
      <div class="student-volunteer"><i class="fas fa-clock"></i> 志愿 ${hours} 小时</div>
      <div class="admin-only" style="margin-top:10px;justify-content:center;gap:5px;">
        <button class="btn btn-sm btn-primary" onclick="openPointsModal('${s.id}','add')" title="加分">+</button>
        <button class="btn btn-sm btn-danger" onclick="openPointsModal('${s.id}','sub')" title="减分">-</button>
        <button class="btn btn-sm" style="background:#2E7D32;color:#fff;" onclick="openVolunteerModal('${s.id}')" title="加志愿时长"><i class="fas fa-clock"></i></button>
      </div>
    `;
    el.appendChild(card);
  });

  // 志愿时长榜
  const rankEl = document.getElementById('volunteerRankList');
  rankEl.innerHTML = '';
  const sorted = [...students].sort((a, b) => getVolunteerHours(b) - getVolunteerHours(a));
  sorted.forEach((s, idx) => {
    if (getVolunteerHours(s) <= 0) return;
    rankEl.innerHTML += `
      <li class="rank-item">
        <div class="rank-num">${idx + 1}</div>
        <div class="rank-name">${s.name} <span style="font-size:12px;color:#999;">${s.student_no}</span></div>
        <div class="rank-hours">${getVolunteerHours(s)} 小时</div>
      </li>
    `;
  });
}

/* ============================================================
 * 交互逻辑
 * ============================================================ */
document.querySelectorAll('.close').forEach(btn => btn.onclick = () => document.getElementById('modal').style.display = 'none');
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  };
});

document.getElementById('addStudentBtn').onclick = async () => {
  const no = document.getElementById('studentNo').value.trim();
  const name = document.getElementById('studentName').value.trim();
  const gender = document.getElementById('studentGender').value;
  if (!no || !name) return alert('学号和姓名必填');
  await sb.from('students').insert({ student_no: no, name, gender, volunteer_hours: 0 });
  document.getElementById('studentNo').value = '';
  document.getElementById('studentName').value = '';
  loadData();
};

function openPointsModal(studentId, type) {
  const s = students.find(x => x.id === studentId);
  let html = `<p style="margin-bottom:15px;font-weight:bold;">学生：${s.name}</p><div class="rules-options">`;
  const filtered = rules.filter(r => type === 'add' ? r.points > 0 : r.points < 0);
  if (!filtered.length) html += `<p>暂无对应规则，请在数据库添加</p>`;
  filtered.forEach(r => {
    html += `<div class="rule-option" onclick="applyPoints('${s.id}', ${r.points}, '${r.name}')"><span>${r.name}</span><span>${r.points}</span></div>`;
  });
  html += `</div>`;
  document.getElementById('modalTitle').textContent = type === 'add' ? '加分' : '减分';
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modal').style.display = 'block';
}

async function applyPoints(studentId, points, reason) {
  const s = students.find(x => x.id === studentId);
  // 留痕：写入 history 表，带上 operator_name
  await sb.from('history').insert({
    student_id: s.id, semester: '2025-2026-1', points, reason,
    operator_id: currentUser.id, operator_name: operatorName
  });
  document.getElementById('modal').style.display = 'none';
  alert('操作成功，已留痕！');
}

function openVolunteerModal(studentId) {
  const s = students.find(x => x.id === studentId);
  document.getElementById('modalTitle').textContent = '添加志愿时长';
  document.getElementById('modalContent').innerHTML = `
    <p style="margin-bottom:10px;">学生：<b>${s.name}</b>（当前 ${getVolunteerHours(s)} 小时）</p>
    <div class="form-group"><input type="number" id="volHours" class="form-control" placeholder="增加的小时数（支持小数）" step="0.5" min="0.5"></div>
    <div class="form-group"><input type="text" id="volReason" class="form-control" placeholder="备注（如：迎新志愿）"></div>
    <button class="btn btn-primary" style="width:100%" onclick="applyVolunteer('${s.id}')">确认添加</button>
  `;
  document.getElementById('modal').style.display = 'block';
}

async function applyVolunteer(studentId) {
  const addHours = parseFloat(document.getElementById('volHours').value);
  const reason = document.getElementById('volReason').value.trim() || '志愿服务';
  if (isNaN(addHours) || addHours <= 0) return alert('请输入有效的大于0的数字');
  
  const s = students.find(x => x.id === studentId);
  const newHours = getVolunteerHours(s) + addHours;
  
  // 更新学生表里的总时长
  await sb.from('students').update({ volunteer_hours: newHours }).eq('id', studentId);
  
  // 留痕：写入 history 表，记录时长和操作人
  await sb.from('history').insert({
    student_id: s.id, semester: '2025-2026-1', points: 0, 
    reason: `[志愿时长] +${addHours}小时 - ${reason}`,
    operator_id: currentUser.id, operator_name: operatorName
  });

  document.getElementById('modal').style.display = 'none';
  loadData();
}

/* ============================================================
 * 批量导入 (Excel)
 * ============================================================ */
document.getElementById('importExcelBtn').onclick = () => document.getElementById('excelFile').click();
document.getElementById('excelFile').onchange = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(evt) {
    const data = new Uint8Array(evt.target.result);
    const wb = XLSX.read(data, { type: 'array' });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
    if (rows.length < 2) return alert('表格内容为空');
    
    let count = 0;
    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      if (!row || row.length < 2) continue;
      const studentNo = String(row[0] || '').trim();
      const pointChange = row[2] !== undefined && row[2] !== '' ? Number(row[2]) : null;
      const volHours = row[3] !== undefined && row[3] !== '' ? Number(row[3]) : null;
      const remark = String(row[4] || '批量导入').trim();

      if (!studentNo) continue;
      const student = students.find(s => s.student_no === studentNo);
      if (!student) continue;

      if (pointChange !== null && !isNaN(pointChange) && pointChange !== 0) {
        await sb.from('history').insert({
          student_id: student.id, semester: '2025-2026-1', points: pointChange, reason: remark,
          operator_id: currentUser.id, operator_name: operatorName
        });
      }
      if (volHours !== null && !isNaN(volHours) && volHours > 0) {
        const newH = getVolunteerHours(student) + volHours;
        await sb.from('students').update({ volunteer_hours: newH }).eq('id', student.id);
        await sb.from('history').insert({
          student_id: student.id, semester: '2025-2026-1', points: 0, reason: `[批量志愿] +${volHours}小时 - ${remark}`,
          operator_id: currentUser.id, operator_name: operatorName
        });
      }
      count++;
    }
    alert(`成功处理 ${count} 条数据！`);
    loadData();
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
};

document.getElementById('exportDataBtn').onclick = () => {
  const wb = XLSX.utils.book_new();
  const rows = [['学号', '姓名', '志愿时长']];
  students.forEach(s => rows.push([s.student_no, s.name, getVolunteerHours(s)]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), '数据');
  XLSX.writeFile(wb, `数据_${new Date().toISOString().slice(0,10)}.xlsx`);
};

/* ============================================================
 * 初始化
 * ============================================================ */
sb.auth.onAuthStateChange((event, session) => {
  if (session) {
    currentUser = session.user;
    isAnonymous = !!currentUser.is_anonymous;
    operatorName = currentUser.user_metadata?.username || '未命名';
    isAdmin = (currentUser.app_metadata?.role === 'admin') && !isAnonymous;
    
    document.body.classList.add('is-admin');
    document.getElementById('userRoleText').textContent = `操作人：${operatorName}`;
    document.getElementById('loginBtn').classList.add('hidden');
    document.getElementById('logoutBtn').classList.remove('hidden');
    loadData();
  } else {
    document.body.classList.remove('is-admin');
    document.getElementById('userRoleText').textContent = '访客（只读）';
    document.getElementById('loginBtn').classList.remove('hidden');
    document.getElementById('logoutBtn').classList.add('hidden');
    loadData();
  }
});
</script>
</body>
</html>

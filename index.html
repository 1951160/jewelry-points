<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>珠宝学院综合积分管理系统 · 联网版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net.cn/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>
:root {
  --primary: #7B1FA2; --primary-light: #AB47BC; --primary-dark: #4A148C;
  --secondary: #9C27B0; --secondary-light: #CE93D8;
  --accent1: #B39DDB; --accent2: #673AB7; --accent3: #8E24AA;
  --white: #FFFFFF; --light: #F7F3FB; --border: #E4D9F0;
  --text: #2D2438; --text-light: #7E6B92;
  --boy: #7E57C2; --boy-light: #B39DDB; --girl: #EC407A; --girl-light: #F8BBD0;
  --radius-sm: 8px; --radius: 16px; --radius-lg: 24px; --radius-full: 1000px;
}
.theme-vibrant {
  --primary: #7B1FA2; --secondary: #9C27B0; --accent1: #B39DDB; --accent2: #673AB7; --accent3: #8E24AA;
}
.theme-pastel {
  --primary: #9C27B0; --secondary: #AB47BC; --accent1: #E1BEE7; --accent2: #9575CD; --accent3: #BA68C8;
  --light: #FAF6FD; --border: #EDE3F5;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Nunito', 'Noto Sans SC', sans-serif; background: var(--light); color: var(--text); line-height: 1.6; min-height: 100vh; overflow-x: hidden; }
h1, h2, h3, h4 { font-family: 'Quicksand', 'Noto Sans SC', sans-serif; font-weight: 800; }
.bg-decoration { position: fixed; inset: 0; pointer-events: none; z-index: -1; }
.bg-circle { position: absolute; border-radius: 50%; opacity: 0.28; filter: blur(45px); }
.bg-circle-1 { background: var(--primary); width: 320px; height: 320px; top: -110px; left: -110px; }
.bg-circle-2 { background: var(--secondary); width: 260px; height: 260px; bottom: -60px; right: -60px; }
.bg-circle-3 { background: var(--accent1); width: 210px; height: 210px; bottom: 30%; left: 10%; }
.bg-circle-4 { background: var(--accent3); width: 190px; height: 190px; top: 20%; right: 15%; }
.app-container { max-width: 1600px; margin: 0 auto; padding: 20px 10px; position: relative; z-index: 1; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; gap: 15px; flex-wrap: wrap; }
.logo { font-family: 'Quicksand', sans-serif; font-size: 26px; font-weight: 900; color: var(--primary-dark); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; letter-spacing: 0.5px; }
.logo .logo-svg { height: 50px; width: 50px; flex-shrink: 0; filter: drop-shadow(0 4px 10px rgba(123,31,162,0.35)); }
.logo span { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.header-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.class-selector-wrapper { display: flex; align-items: center; gap: 6px; background: var(--white); padding: 5px 10px; border-radius: var(--radius-full); border: 2px solid var(--border); box-shadow: 0 2px 6px rgba(123,31,162,0.05); }
.class-selector-wrapper label { font-weight: 700; font-size: 14px; white-space: nowrap; color: var(--text); }
.class-selector-wrapper select { border: none; outline: none; font-family: inherit; font-weight: 700; font-size: 15px; background: transparent; cursor: pointer; min-width: 110px; color: var(--primary-dark); }
.class-selector-wrapper .btn-icon-mini { width: 26px; height: 26px; border-radius: 50%; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; padding: 0; transition: all 0.2s; }
.btn { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 14px; padding: 10px 18px; border-radius: var(--radius-full); border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s ease; text-decoration: none; }
.btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; box-shadow: 0 3px 10px rgba(123,31,162,0.3); }
.btn-primary:hover { filter: brightness(1.12); transform: translateY(-2px); }
.btn-secondary { background: linear-gradient(135deg, var(--secondary) 0%, var(--accent3) 100%); color: white; box-shadow: 0 3px 10px rgba(156,39,176,0.25); }
.btn-secondary:hover { filter: brightness(1.12); transform: translateY(-2px); }
.btn-accent1 { background: var(--accent1); color: var(--primary-dark); }
.btn-accent1:hover { filter: brightness(1.05); transform: translateY(-2px); }
.btn-accent2 { background: linear-gradient(135deg, var(--accent2) 0%, var(--primary-dark) 100%); color: white; box-shadow: 0 3px 10px rgba(103,58,183,0.3); }
.btn-accent2:hover { filter: brightness(1.12); transform: translateY(-2px); }
.btn-accent3 { background: var(--accent3); color: white; }
.btn-accent3:hover { filter: brightness(1.12); transform: translateY(-2px); }
.btn-danger { background: var(--primary-dark); color: white; }
.btn-danger:hover { filter: brightness(1.15); transform: translateY(-2px); }
.btn-white { background: var(--white); color: var(--text); border: 2px solid var(--border); }
.btn-white:hover { transform: translateY(-2px); border-color: var(--primary-light); }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn-icon { width: 36px; height: 36px; padding: 0; border-radius: 50%; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
.main-content { display: flex; gap: 20px; }
.left-panel { flex: 2; min-width: 0; } .right-panel { flex: 1; min-width: 300px; }
@media (max-width: 1200px) { .main-content { flex-direction: column; } .left-panel, .right-panel { width: 100%; } }
.card { background: var(--white); border-radius: var(--radius); box-shadow: 0 8px 22px rgba(74,20,140,0.08); margin-bottom: 20px; overflow: hidden; border: 2px solid var(--border); position: relative; }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(to right, var(--primary), var(--primary-light), var(--accent1), var(--secondary)); }
.card-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); gap: 10px; flex-wrap: wrap; }
.card-title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: var(--primary-dark); }
.card-body { padding: 20px; }
.form-group { margin-bottom: 15px; }
.form-label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 14px; color: var(--text); }
.form-control { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: var(--radius); font-family: inherit; font-size: 15px; transition: all 0.2s; background: var(--white); }
.form-control:focus { outline: none; border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(171,71,188,0.18); }
.radio-group { display: flex; gap: 20px; margin: 8px 0; flex-wrap: wrap; }
.radio-container { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.radio-input { display: none; }
.radio-mark { width: 22px; height: 22px; border: 2px solid var(--border); border-radius: 50%; position: relative; }
.radio-mark::after { content: ''; width: 10px; height: 10px; background: var(--secondary); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); transition: all 0.2s; }
.radio-input:checked + .radio-mark { border-color: var(--primary-light); }
.radio-input:checked + .radio-mark::after { transform: translate(-50%, -50%) scale(1); }
.radio-male .radio-input:checked + .radio-mark { border-color: var(--boy); }
.radio-male .radio-input:checked + .radio-mark::after { background: var(--boy); }
.radio-female .radio-input:checked + .radio-mark { border-color: var(--girl); }
.radio-female .radio-input:checked + .radio-mark::after { background: var(--girl); }
.student-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 15px; min-height: 120px; background: var(--white); border: 2px dashed var(--border); border-radius: var(--radius); transition: all 0.2s; }
.student-card { position: relative; cursor: pointer; transition: transform 0.2s; }
.student-card:hover { transform: translateY(-5px); }
.student-card-inner { background: var(--white); border-radius: var(--radius); overflow: hidden; box-shadow: 0 6px 15px rgba(74,20,140,0.09); height: 100%; display: flex; flex-direction: column; }
.student-card.male .student-card-inner { border: 3px solid var(--boy); }
.student-card.female .student-card-inner { border: 3px solid var(--girl); }
.student-card.has-warning .student-card-inner { box-shadow: 0 0 0 3px #E91E63, 0 6px 15px rgba(233,30,99,0.3); animation: warningPulse 2s infinite; }
@keyframes warningPulse { 0%, 100% { box-shadow: 0 0 0 3px #E91E63, 0 6px 15px rgba(233,30,99,0.3); } 50% { box-shadow: 0 0 0 5px #E91E63, 0 6px 20px rgba(233,30,99,0.5); } }
.student-avatar { width: 70px; height: 70px; border-radius: 50%; margin: 15px auto 8px; display: flex; justify-content: center; align-items: center; font-size: 28px; font-weight: 900; color: white; cursor: pointer; position: relative; overflow: hidden; }
.student-avatar.male { background: linear-gradient(135deg, var(--boy), var(--boy-light)); }
.student-avatar.female { background: linear-gradient(135deg, var(--girl), var(--girl-light)); }
.student-avatar img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
.student-info { padding: 10px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; }
.student-name { font-weight: 800; font-size: 16px; margin-bottom: 4px; display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; }
.student-name .edit-student-btn { cursor: pointer; font-size: 12px; color: var(--text-light); }
.warning-icon { color: #E91E63; font-size: 14px; animation: warningPulse 1.5s infinite; }
.student-meta { font-size: 12px; color: var(--text-light); margin-bottom: 6px; word-break: break-all; }
.student-points { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; }
.points-row { display: flex; justify-content: space-between; font-size: 13px; }
.points-label { color: var(--text-light); } .points-value { font-weight: 700; color: var(--primary); }
.male .points-value { color: var(--boy); } .female .points-value { color: var(--girl); }
.student-controls { display: flex; justify-content: center; gap: 4px; }
.student-controls .btn-icon { width: 30px; height: 30px; font-size: 12px; }
.delete-student-container { margin-top: 8px; }
.delete-student-btn { width: 100%; font-size: 11px; padding: 4px 8px; }
.dorm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
.dorm-card { background: var(--white); border-radius: var(--radius); padding: 15px; box-shadow: 0 6px 15px rgba(74,20,140,0.07); border: 2px solid var(--border); cursor: pointer; transition: all 0.2s; border-left: 6px solid var(--primary); }
.dorm-card:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(123,31,162,0.15); }
.dorm-card h4 { font-size: 18px; margin-bottom: 6px; color: var(--primary-dark); }
.dorm-card .dorm-count { font-size: 13px; color: var(--text-light); }
.dorm-card .dorm-points { font-size: 14px; font-weight: 700; color: var(--primary); margin-top: 6px; }
.tabs { display: flex; background: var(--white); border-radius: var(--radius) var(--radius) 0 0; overflow: hidden; border-bottom: 3px solid var(--primary); flex-wrap: wrap; }
.tab-btn { flex: 1; padding: 12px 16px; background: var(--white); color: var(--text); font-weight: 700; font-family: 'Quicksand', sans-serif; cursor: pointer; transition: all 0.2s; border: none; border-right: 1px solid var(--border); font-size: 15px; min-width: 100px; }
.tab-btn:last-child { border-right: none; }
.tab-btn:hover { background: var(--light); color: var(--primary); }
.tab-btn.active { color: var(--primary); background: var(--white); border-bottom: 3px solid var(--primary); margin-bottom: -3px; }
.tab-content { display: none; background: var(--white); border-radius: 0 0 var(--radius) var(--radius); padding: 20px; box-shadow: 0 6px 15px rgba(74,20,140,0.07); border: 2px solid var(--border); border-top: none; }
.tab-content.active { display: block; }
.leaderboard-list { margin-top: 15px; }
.leaderboard-item { display: flex; align-items: center; padding: 12px; margin-bottom: 10px; border-radius: var(--radius); background: var(--light); transition: all 0.2s; border-left: 5px solid var(--primary); gap: 12px; }
.leaderboard-item:hover { transform: translateX(5px); box-shadow: 0 5px 12px rgba(74,20,140,0.1); }
.leaderboard-item.has-warning { background: rgba(233,30,99,0.08); border-left-color: #E91E63; }
.rank-1 { border-left-color: #FFD639; } .rank-2 { border-left-color: var(--primary-light); } .rank-3 { border-left-color: var(--secondary); }
.leaderboard-rank { width: 32px; height: 32px; border-radius: 50%; font-weight: 800; display: flex; justify-content: center; align-items: center; background: var(--white); border: 2px solid var(--border); flex-shrink: 0; }
.rank-1 .leaderboard-rank { background: #FFD639; border-color: #FFD639; }
.rank-2 .leaderboard-rank { background: var(--primary-light); color: white; border-color: var(--primary-light); }
.rank-3 .leaderboard-rank { background: var(--secondary); color: white; border-color: var(--secondary); }
.leaderboard-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 700; color: white; overflow: hidden; flex-shrink: 0; }
.leaderboard-avatar.male { background: linear-gradient(135deg, var(--boy), var(--boy-light)); }
.leaderboard-avatar.female { background: linear-gradient(135deg, var(--girl), var(--girl-light)); }
.leaderboard-avatar img { width: 100%; height: 100%; object-fit: cover; }
.leaderboard-info { flex: 1; min-width: 0; }
.leaderboard-name { font-weight: 700; font-size: 16px; margin-bottom: 2px; }
.leaderboard-meta { font-size: 12px; color: var(--text-light); }
.leaderboard-points { font-weight: 800; font-size: 18px; color: var(--primary); }
.leaderboard-item.has-warning .leaderboard-points { color: #E91E63; }
.rules-management { margin-top: 10px; }
.rule-input { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
.rule-input input { flex: 1; min-width: 100px; }
.rules-list { max-height: 500px; overflow-y: auto; padding-right: 5px; }
.rule-item { display: flex; align-items: center; padding: 10px 12px; margin-bottom: 8px; border-radius: var(--radius); background: var(--light); border-left: 5px solid var(--border); gap: 8px; }
.rule-item.positive { border-left-color: var(--accent2); background: rgba(103,58,183,0.08); }
.rule-item.negative { border-left-color: #E91E63; background: rgba(233,30,99,0.08); }
.rule-text { flex: 1; font-weight: 600; word-break: break-all; }
.rule-points { font-weight: 800; font-size: 16px; }
.rule-points.positive { color: var(--accent2); } .rule-points.negative { color: #E91E63; }
.rule-actions { display: flex; gap: 4px; }
.rule-actions .btn-icon { width: 28px; height: 28px; font-size: 12px; }
.rules-options { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 15px; }
.rule-option { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: var(--radius); cursor: pointer; transition: all 0.2s; gap: 8px; }
.rule-option.positive { background: rgba(103,58,183,0.1); border-left: 4px solid var(--accent2); }
.rule-option.negative { background: rgba(233,30,99,0.1); border-left: 4px solid #E91E63; }
.rule-option:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(74,20,140,0.1); }
.modal { display: none; position: fixed; inset: 0; background: rgba(45,20,60,0.55); z-index: 1000; overflow-y: auto; }
.modal-content { background: var(--white); border-radius: var(--radius-lg); width: 90%; max-width: 600px; margin: 5vh auto; box-shadow: 0 15px 45px rgba(74,20,140,0.35); overflow: hidden; }
.modal-header { padding: 16px 22px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; position: relative; }
.modal-title { font-size: 20px; font-weight: 800; }
.close { position: absolute; top: 14px; right: 20px; font-size: 24px; color: white; cursor: pointer; line-height: 1; transition: transform 0.2s; }
.close:hover { transform: rotate(90deg); }
.modal-body { padding: 22px; max-height: 70vh; overflow-y: auto; }
.modal-footer { padding: 12px 22px; display: flex; justify-content: flex-end; gap: 10px; border-top: 2px solid var(--border); flex-wrap: wrap; }
.timer-tabs { display: flex; border-bottom: 1px solid var(--border); }
.timer-tab-btn { flex: 1; background: var(--light); border: none; padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer; color: var(--text-light); }
.timer-tab-btn.active { background: var(--white); color: var(--primary); border-bottom: 3px solid var(--primary); }
.timer-content { padding: 25px 20px; }
.timer-pane { display: none; text-align: center; } .timer-pane.active { display: block; }
.timer-display { font-size: 56px; font-weight: 700; margin-bottom: 25px; color: var(--text); }
.timer-controls { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
.countdown-inputs { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 18px; }
.countdown-inputs input { width: 70px; text-align: center; font-size: 20px; padding: 8px; border: 2px solid var(--border); border-radius: var(--radius); }
.countdown-inputs span { font-size: 20px; font-weight: 700; color: var(--text-light); }
#countdownDisplay.hidden, #countdownInputs.hidden { display: none; }
#timerBtn.timer-active { min-width: 130px; }
.history-list { max-height: 400px; overflow-y: auto; }
.history-item { display: flex; align-items: flex-start; padding: 10px 12px; margin-bottom: 8px; border-radius: var(--radius); background: var(--light); gap: 10px; position: relative; padding-right: 45px; }
.history-item.positive { border-left: 4px solid var(--accent2); }
.history-item.negative { border-left: 4px solid #E91E63; }
.history-date { color: var(--text-light); font-size: 12px; flex-shrink: 0; }
.history-reason { flex: 1; font-weight: 600; word-break: break-all; font-size: 14px; }
.history-operator { font-size: 11px; color: var(--text-light); margin-top: 4px; }
.history-points { font-weight: 700; font-size: 16px; }
.history-points.positive { color: var(--accent2); } .history-points.negative { color: #E91E63; }
.btn-revert-history { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-light); font-size: 14px; padding: 4px; border-radius: 50%; width: 28px; height: 28px; }
.btn-revert-history:hover { color: var(--primary); background: var(--border); }
.text-center { text-align: center; }
.mb-1 { margin-bottom: 8px; } .mb-2 { margin-bottom: 15px; } .mt-1 { margin-top: 8px; } .mt-2 { margin-top: 15px; }
.d-flex { display: flex; } .gap-2 { gap: 8px; }
.positive { color: var(--accent2); } .negative { color: #E91E63; }
.multi-select-info { background: var(--light); padding: 10px; border-radius: var(--radius-sm); margin-bottom: 12px; font-size: 13px; }
.multi-select-info span { font-style: italic; color: var(--text-light); word-break: break-all; }
.custom-points { background: var(--light); padding: 15px; border-radius: var(--radius); margin-top: 15px; }
.custom-points h4 { margin-bottom: 10px; color: var(--primary-dark); }
.hidden-input { display: none; }
.fitness-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 15px; background: var(--light); border-radius: var(--radius); margin-bottom: 15px; }
.fitness-toolbar label { font-weight: 700; font-size: 14px; white-space: nowrap; color: var(--text); }
.fitness-toolbar input[type="number"] { width: 90px; padding: 8px 10px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-family: inherit; font-size: 15px; }
.fitness-toolbar select { padding: 8px 12px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; font-weight: 700; background: var(--white); cursor: pointer; min-width: 140px; color: var(--primary-dark); }
.fitness-hint { font-size: 13px; color: var(--text-light); padding: 10px 14px; background: rgba(171,71,188,0.08); border-left: 4px solid var(--primary-light); border-radius: var(--radius-sm); margin-bottom: 15px; }
.fitness-hint strong { color: var(--primary-dark); }
.fitness-hint .warn { color: #E91E63; font-weight: 700; }
.fitness-table-wrap { overflow-x: auto; border-radius: var(--radius); border: 2px solid var(--border); }
.fitness-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 800px; }
.fitness-table th, .fitness-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
.fitness-table th { background: var(--light); font-weight: 700; font-size: 13px; color: var(--text-light); position: sticky; top: 0; }
.fitness-table tr:last-child td { border-bottom: none; }
.fitness-table tr.warning { background: rgba(233,30,99,0.08); }
.fitness-table tr.warning td { color: #C2185B; }
.fitness-table tr.zero-row { background: rgba(126,107,146,0.06); }
.fitness-score { font-weight: 700; font-size: 15px; }
.fitness-score.excellent { color: var(--accent2); }
.fitness-score.good { color: var(--secondary); }
.fitness-score.pass { color: var(--text); }
.fitness-score.fail { color: #E91E63; font-weight: 900; }
.fitness-applied { font-weight: 700; color: var(--primary); }
.fitness-applied.zero { color: var(--text-light); font-style: italic; }
.fitness-warning-tag { display: inline-flex; align-items: center; gap: 4px; background: #E91E63; color: white; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }
.fitness-normal-tag { display: inline-flex; align-items: center; gap: 4px; background: rgba(103,58,183,0.15); color: var(--accent2); padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }
.fitness-zero-tag { display: inline-flex; align-items: center; gap: 4px; background: rgba(126,107,146,0.2); color: var(--text-light); padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }
.fitness-empty-tag { color: var(--text-light); font-style: italic; font-size: 13px; }
.fitness-stat-bar { display: flex; flex-wrap: wrap; gap: 15px; padding: 12px 15px; background: var(--white); border-radius: var(--radius); border: 2px solid var(--border); margin-bottom: 15px; }
.fitness-stat-item { display: flex; flex-direction: column; gap: 2px; min-width: 90px; }
.fitness-stat-label { font-size: 12px; color: var(--text-light); }
.fitness-stat-value { font-size: 20px; font-weight: 800; color: var(--primary); }
.fitness-chart-wrap { background: var(--white); border: 2px solid var(--border); border-radius: var(--radius); padding: 15px; margin-bottom: 15px; position: relative; }
.fitness-chart-wrap h4 { font-size: 16px; color: var(--text); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fitness-chart-wrap h4 .hint { font-size: 12px; color: var(--text-light); font-weight: 400; margin-left: auto; }
#fitnessTrendChart { width: 100%; height: 280px; display: block; }
.dorm-detail-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.dorm-detail-table th { padding: 8px; text-align: left; background: var(--light); font-weight: 700; font-size: 13px; color: var(--text-light); }
.dorm-detail-table td { padding: 8px; border-bottom: 1px solid var(--border); }
.dorm-detail-table .ops { white-space: nowrap; text-align: center; }
.dorm-detail-table .ops .btn { padding: 4px 8px; font-size: 12px; }
.vol-rank-item { display: flex; align-items: center; padding: 12px; margin-bottom: 10px; border-radius: var(--radius); background: var(--light); transition: all 0.2s; border-left: 5px solid var(--accent2); gap: 12px; }
</style>
</head>

              <label>体测学年：</label>

              <input type="number" id="fitnessPercentInput" min="0" max="100" step="0.1" value="20"> %
              <button id="saveFitnessPercentBtn" class="btn btn-sm btn-primary">保存</button>

      <div id="rules" class="tab-content">
        <h3><i class="fas fa-gavel"></i> 积分规则（全局通用）</h3>

<!-- 模态框 -->
<div id="modal" class="modal">
  <div class="modal-content">

      <h3 class="modal-title" id="modalTitle">操作</h3>

<!-- 计时器 -->

  </div>
</div>

<script>
/* ============================================================
 * ★ 1. Supabase 配置
 * ============================================================ */
const SUPABASE_URL = 'https://yjexkrbxgzqusoojxbke.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqZXhrcmJ4Z3pxdXNvb2p4YmtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MjA2MDAsImV4cCI6MjEwODE5NjYwMH0.-loqPcHO_CSJLCt1f1ZFPWCzEqBNABTOwVcN5yRnCdA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================
 * 全局状态
 * ============================================================ */
let currentUser = null;
let operatorName = '';
let isAdmin = false;

let classes = [];
let students = [];     // 当前班级学生
let history = [];      // 所有历史记录
let rules = [];
let currentClassName = '';
let currentClassId = '';
let semesters = ['2025-2026-1'];
let currentSemester = '2025-2026-1';
let currentAcademicYear = '';
let fitnessPercent = 20;
let currentThemeIndex = 1;
const themes = ['theme-vibrant', 'theme-pastel'];
const WARNING_THRESHOLD = 60;
const BASE_POINTS = 100;
const FITNESS_ZERO_THRESHOLD = 60;

/* ============================================================
 * Supabase 鉴权 (名字+密码 -> 虚拟邮箱)
 * ============================================================ */
function usernameToEmail(name) {
  const safe = encodeURIComponent(name.trim().toLowerCase()).replace(/%/g,'');
  return `${safe}@jewelry-points.local`;
}

document.getElementById('loginBtn').onclick = () => {
  showModal('登录 / 注册', `
    <div class="form-group"><label class="form-label">操作人姓名（拼音）</label><input type="text" id="authUser" class="form-control" placeholder="如：zhangsan"></div>
    <div class="form-group"><label class="form-label">密码（至少6位）</label><input type="password" id="authPass" class="form-control"></div>
    <div style="display:flex;gap:10px;margin-top:15px;">
      <button class="btn btn-primary" style="flex:1" onclick="doAuth('login')">登录</button>
      <button class="btn btn-secondary" style="flex:1" onclick="doAuth('register')">注册</button>
    </div>
  `);
  document.getElementById('modal').style.display = 'block';
};

async function doAuth(mode) {
  const u = document.getElementById('authUser').value.trim();
  const p = document.getElementById('authPass').value;
  if (!u || !p) return alert('请填写姓名和密码');
  const email = usernameToEmail(u);
  
  try {
    if (mode === 'register') {
      const { data, error } = await sb.auth.signUp({ email, password: p, options: { data: { username: u } } });
      if (error) throw error;
      if (!data.session) return alert('注册成功，请点击登录。');
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: p });
      if (error) throw error;
    }
    closeModal();
  } catch (err) {
    alert((mode === 'login' ? '登录' : '注册') + '失败：' + err.message);
  }
}

document.getElementById('logoutBtn').onclick = async () => {
  await sb.auth.signOut();
  location.reload();
};

// 监听登录状态
sb.auth.onAuthStateChange((event, session) => {
  if (session) {
    currentUser = session.user;
    operatorName = currentUser.user_metadata?.username || '未知用户';
    isAdmin = (currentUser.app_metadata?.role === 'admin') || true; // 为了好用，默认所有登录用户均可操作，具体可在数据库限制
    
    document.getElementById('currentUserName').textContent = `操作人：${operatorName}`;
    document.getElementById('loginBtn').classList.add('hidden');
    document.getElementById('logoutBtn').classList.remove('hidden');
    
    document.getElementById('appContainer').style.display = 'block';
    loadData();
  } else {
    document.getElementById('currentUserName').textContent = '未登录（只读）';
    document.getElementById('loginBtn').classList.remove('hidden');
    document.getElementById('logoutBtn').classList.add('hidden');
    
    document.getElementById('appContainer').style.display = 'block';
    loadData();
  }
});

/* ============================================================
 * 数据加载 (从 Supabase)
 * ============================================================ */
async function loadData() {
  try {
    // 1. 班级
    const { data: clsData } = await sb.from('classes').select('*').order('name');
    classes = clsData || [];
    if (classes.length > 0 && (!currentClassName || !classes.some(c=>c.name===currentClassName))) {
      currentClassName = classes[0].name;
      currentClassId = classes[0].id;
    }

    // 2. 规则
    const { data: ruleData } = await sb.from('rules').select('*');
    rules = ruleData || [];

    // 3. 当前班级学生
    if (currentClassId) {
      const { data: stuData } = await sb.from('students').select('*').eq('class_id', currentClassId).order('student_no');
      students = stuData || [];
    } else {
      students = [];
    }

    // 4. 历史记录 (拉取这些学生的所有记录)
    if (students.length > 0) {
      const ids = students.map(s => s.id);
      const { data: hisData } = await sb.from('history').select('*').in('student_id', ids);
      history = hisData || [];
    } else {
      history = [];
    }

    updateUI();
  } catch (err) {
    console.error(err);
    alert('数据加载失败，请检查网络或权限配置。');
  }
}

/* ============================================================
 * 计算逻辑
 * ============================================================ */
function getStudentHistory(studentId) {
  return history.filter(h => h.student_id === studentId);
}

function getTotalPoints(student) {
  let total = BASE_POINTS;
  const hList = getStudentHistory(student.id);
  hList.forEach(h => total += Number(h.points));
  
  // 体测折算
  const year = currentAcademicYear || '2025-2026';
  let fitScore = 0;
  // 这里为了简化，直接从学生记录里找，如果数据库里有体测成绩的话
  // 因为原版体测存在本地，现在联机版简化为直接从历史记录里判断（或者不做体测计算，只算纯加减分）
  // 为了保持原版体验，如果您需要完整版体测，建议在 supabase 建 fitness 表，这里为了不增加复杂度，暂不加。
  
  return Math.round(total * 100) / 100;
}

function getVolunteerHours(student) {
  return Number(student.volunteer_hours) || 0;
}

/* ============================================================
 * UI 渲染
 * ============================================================ */
function updateUI() {
  renderClassSelector();
  
  // 1. 学生列表
  const el = document.getElementById('allStudents');
  el.innerHTML = '';
  if (!classes.length) {
    el.innerHTML = '<p style="grid-column:1/-1;text-align:center;">暂无班级数据</p>';
  } else {
    students.forEach(s => {
      const total = getTotalPoints(s);
      const hours = getVolunteerHours(s);
      const hasWarning = total < WARNING_THRESHOLD;
      
      const card = document.createElement('div');
      card.className = `student-card ${s.gender} ${hasWarning ? 'has-warning' : ''}`;
      card.innerHTML = `
        <div class="student-card-inner">
          <div class="student-avatar ${s.gender}">${escapeHtml(s.name.charAt(0))}</div>
          <div class="student-info">
            <div class="student-name">${escapeHtml(s.name)}</div>
            <div class="student-meta">${escapeHtml(s.student_no)} · ${escapeHtml(s.dorm_no||'无')}</div>
            <div class="student-points">
              <div class="points-row"><span class="points-label">总分</span><span class="points-value" style="color:${hasWarning?'#E91E63':''};">${total.toFixed(2)}</span></div>
              <div class="points-row"><span class="points-label">志愿</span><span class="points-value" style="color:var(--accent2);">${hours} 小时</span></div>
            </div>
            <div class="student-controls admin-only">
              <button class="btn btn-icon btn-primary" onclick="event.stopPropagation(); showPointsModal('${s.id}','add')" title="加分">+</button>
              <button class="btn btn-icon btn-danger" onclick="event.stopPropagation(); showPointsModal('${s.id}','sub')" title="减分">-</button>
              <button class="btn btn-icon btn-accent1" onclick="event.stopPropagation(); showVolunteerModal('${s.id}')" title="加时长"><i class="fas fa-clock"></i></button>
              <button class="btn btn-icon btn-secondary" onclick="event.stopPropagation(); showHistoryModal('${s.id}')" title="历史"><i class="fas fa-history"></i></button>
            </div>
          </div>
        </div>
      `;
      card.onclick = () => showHistoryModal(s.id);
      el.appendChild(card);
    });
  }

  // 2. 志愿榜
  const vEl = document.getElementById('volunteerLeaderboardList');
  vEl.innerHTML = '';
  const sortedVol = [...students].sort((a,b) => getVolunteerHours(b) - getVolunteerHours(a));
  sortedVol.forEach((s, i) => {
    if (getVolunteerHours(s) <= 0) return;
    vEl.innerHTML += `
      <div class="leaderboard-item vol-rank-item">
        <div class="leaderboard-rank">${i+1}</div>
        <div class="leaderboard-info">
          <div class="leaderboard-name">${escapeHtml(s.name)}</div>
          <div class="leaderboard-meta">${escapeHtml(s.student_no)}</div>
        </div>
        <div class="leaderboard-points" style="color:#2E7D32;">${getVolunteerHours(s)} 小时</div>
      </div>
    `;
  });

  // 3. 宿舍
  const dEl = document.getElementById('dormsArea');
  dEl.innerHTML = '';
  const dormMap = {};
  students.forEach(s => {
    if (!s.dorm_no) return;
    if (!dormMap[s.dorm_no]) dormMap[s.dorm_no] = [];
    dormMap[s.dorm_no].push(s);
  });
  Object.keys(dormMap).sort().forEach(no => {
    const list = dormMap[no];
    const total = list.reduce((sum, s) => sum + getTotalPoints(s), 0);
    dEl.innerHTML += `
      <div class="dorm-card" onclick="showDormDetailModal('${no}')">
        <h4><i class="fas fa-door-open"></i> ${no} 宿舍</h4>
        <div class="dorm-count">${list.length} 人</div>
        <div class="dorm-points">总分: ${total.toFixed(2)}</div>
      </div>
    `;
  });

  // 4. 综合排行
  const lEl = document.getElementById('studentLeaderboardList');
  lEl.innerHTML = '';
  [...students].sort((a, b) => getTotalPoints(b) - getTotalPoints(a)).forEach((s, i) => {
    const total = getTotalPoints(s);
    lEl.innerHTML += `
      <div class="leaderboard-item ${i < 3 ? 'rank-' + (i+1) : ''}">
        <div class="leaderboard-rank">${i+1}</div>
        <div class="leaderboard-avatar ${s.gender}">${escapeHtml(s.name.charAt(0))}</div>
        <div class="leaderboard-info">
          <div class="leaderboard-name">${escapeHtml(s.name)}</div>
          <div class="leaderboard-meta">${escapeHtml(s.student_no)}</div>
        </div>
        <div class="leaderboard-points">${total.toFixed(2)}</div>
      </div>
    `;
  });

  // 5. 规则
  const rEl = document.getElementById('rulesList');
  rEl.innerHTML = '';
  rules.forEach(r => {
    rEl.innerHTML += `<div class="rule-item ${r.points>0?'positive':'negative'}"><div class="rule-text">${escapeHtml(r.name)}</div><div class="rule-points">${r.points>0?'+':''}${r.points}</div></div>`;
  });
}

function renderClassSelector() {
  const sel = document.getElementById('classSelector');
  sel.innerHTML = '';
  if (!classes.length) return;
  classes.forEach(c => {
    sel.innerHTML += `<option value="${c.id}" ${c.name === currentClassName ? 'selected' : ''}>${c.name}</option>`;
  });
  document.getElementById('semesterSelector').innerHTML = `<option>${currentSemester}</option>`;
}

/* ============================================================
 * 加减分与志愿时长逻辑
 * ============================================================ */
function showPointsModal(studentId, type) {
  if (!currentUser) return alert('请先登录');
  const s = students.find(x => x.id === studentId);
  let html = `<p style="margin-bottom:15px;font-weight:bold;">学生：${s.name}</p><div class="rules-options">`;
  const filtered = rules.filter(r => type === 'add' ? r.points > 0 : r.points < 0);
  filtered.forEach(r => {
    html += `<div class="rule-option" onclick="applyPoints('${s.id}', ${r.points}, '${escapeHtml(r.name)}')"><span>${escapeHtml(r.name)}</span><span>${r.points}</span></div>`;
  });
  html += `</div>
    <div class="custom-points">
      <h4>自定义${type==='add'?'加分':'减分'}</h4>
      <input type="number" id="customPts" class="form-control mb-1" placeholder="分数">
      <input type="text" id="customReason" class="form-control mb-1" placeholder="原因">
      <button class="btn btn-primary" onclick="applyCustomPoints('${s.id}', '${type}')"><i class="fas fa-check"></i> 应用</button>
    </div>`;
  showModal(type === 'add' ? '加分' : '减分', html);
}

async function applyPoints(studentId, points, reason) {
  await sb.from('history').insert({
    student_id: studentId, semester: currentSemester, points: points, reason: reason,
    operator_id: currentUser.id, operator_name: operatorName
  });
  closeModal();
  loadData();
}

async function applyCustomPoints(studentId, type) {
  let pts = parseInt(document.getElementById('customPts').value);
  const reason = document.getElementById('customReason').value.trim() || '自定义';
  if (isNaN(pts)) return alert('请输入分数');
  if (type === 'sub' && pts > 0) pts = -pts;
  if (type === 'add' && pts < 0) pts = Math.abs(pts);
  await applyPoints(studentId, pts, reason);
}

function showVolunteerModal(studentId) {
  if (!currentUser) return alert('请先登录');
  const s = students.find(x => x.id === studentId);
  showModal(`添加志愿时长：${s.name}`, `
    <p style="margin-bottom:10px;">当前时长：<b>${getVolunteerHours(s)}</b> 小时</p>
    <div class="form-group"><label class="form-label">增加时长（小时）</label><input type="number" id="volHours" class="form-control" step="0.5" min="0.5"></div>
    <div class="form-group"><label class="form-label">备注</label><input type="text" id="volReason" class="form-control" placeholder="如：迎新志愿"></div>
    <button class="btn btn-primary" style="width:100%;" onclick="applyVolunteer('${s.id}')">确认添加</button>
  `);
  document.getElementById('modal').style.display = 'block';
}

async function applyVolunteer(studentId) {
  const h = parseFloat(document.getElementById('volHours').value);
  const r = document.getElementById('volReason').value.trim() || '志愿服务';
  if (isNaN(h) || h <= 0) return alert('请输入有效时长');
  
  const s = students.find(x => x.id === studentId);
  const newH = getVolunteerHours(s) + h;
  
  await sb.from('students').update({ volunteer_hours: newH }).eq('id', studentId);
  await sb.from('history').insert({
    student_id: studentId, semester: currentSemester, points: 0, reason: `[志愿] +${h}小时 - ${r}`,
    operator_id: currentUser.id, operator_name: operatorName
  });
  closeModal();
  loadData();
}

function showHistoryModal(studentId) {
  const s = students.find(x => x.id === studentId);
  const list = getStudentHistory(studentId).sort((a,b) => new Date(b.created_at||Date.now()) - new Date(a.created_at||Date.now()));
  let html = `<div class="history-list">`;
  if (!list.length) html += '<p>暂无记录</p>';
  list.forEach(h => {
    const cls = h.points >= 0 ? 'positive' : 'negative';
    html += `
      <div class="history-item ${cls}">
        <div style="flex:1;">
          <div class="history-date">${new Date(h.created_at || Date.now()).toLocaleString()}</div>
          <div class="history-reason">${escapeHtml(h.reason)}</div>
          <div class="history-operator"><i class="fas fa-user-edit"></i> 操作人：${escapeHtml(h.operator_name || '系统')}</div>
        </div>
        <div class="history-points ${cls}">${h.points>0?'+':''}${h.points}</div>
      </div>
    `;
  });
  html += `</div>`;
  html += `<div style="margin-top:15px;text-align:center;font-weight:700;">当前总分：<span style="color:var(--primary);font-size:20px;">${getTotalPoints(s).toFixed(2)}</span></div>`;
  showModal(`${s.name} 的历史记录`, html);
}

/* ============================================================
 * 宿舍批量操作
 * ============================================================ */
function showDormDetailModal(dormNo) {
  const list = students.filter(s => s.dorm_no === dormNo);
  let html = '<table class="dorm-detail-table"><thead><tr><th>姓名</th><th>分数</th><th>操作</th></tr></thead><tbody>';
  list.forEach(s => {
    html += `<tr><td>${s.name}</td><td>${getTotalPoints(s).toFixed(1)}</td><td>
      <button class="btn btn-sm btn-primary" onclick="showPointsModal('${s.id}','add')">+</button>
      <button class="btn btn-sm btn-danger" onclick="showPointsModal('${s.id}','sub')">-</button>
    </td></tr>`;
  });
  html += '</tbody></table>';
  html += `<div style="margin-top:15px; text-align:center;">
    <button class="btn btn-accent1" onclick="showDormBatchModal('${dormNo}')" style="width:100%;"><i class="fas fa-users-cog"></i> 一键给全宿舍加减分</button>
  </div>`;
  showModal(`${dormNo} 宿舍详情`, html);
}

function showDormBatchModal(dormNo) {
  if (!currentUser) return alert('请先登录');
  let html = `<p>为该宿舍所有成员统一操作：</p><div class="rules-options">`;
  rules.forEach(r => {
    html += `<div class="rule-option" onclick="applyDormBatch('${dormNo}', ${r.points}, '${escapeHtml(r.name)}')"><span>${escapeHtml(r.name)}</span><span>${r.points}</span></div>`;
  });
  html += `</div>`;
  showModal('宿舍批量操作', html);
}

async function applyDormBatch(dormNo, points, reason) {
  const list = students.filter(s => s.dorm_no === dormNo);
  const inserts = list.map(s => ({
    student_id: s.id, semester: currentSemester, points: points, reason: `[宿舍] ${reason}`,
    operator_id: currentUser.id, operator_name: operatorName
  }));
  await sb.from('history').insert(inserts);
  closeModal();
  loadData();
  alert(`已为该宿舍 ${list.length} 人统一操作！`);
}

/* ============================================================
 * 批量导入 (Excel)
 * ============================================================ */
document.getElementById('importVolunteerBtn').onclick = () => document.getElementById('importVolunteerFile').click();
document.getElementById('importVolunteerFile').onchange = function(e) {
  if (!currentUser) return alert('请先登录');
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async evt => {
    const wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
    let count = 0;
    
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      if (!r || !r[0]) continue;
      const no = String(r[0]).trim();
      const hours = parseFloat(r[1]);
      if (isNaN(hours) || hours <= 0) continue;
      
      const s = students.find(x => x.student_no === no);
      if (!s) continue;
      
      const newH = getVolunteerHours(s) + hours;
      await sb.from('students').update({ volunteer_hours: newH }).eq('id', s.id);
      await sb.from('history').insert({
        student_id: s.id, semester: currentSemester, points: 0, reason: `[批量志愿] +${hours}小时`,
        operator_id: currentUser.id, operator_name: operatorName
      });
      count++;
    }
    alert(`成功导入 ${count} 条志愿时长记录`);
    loadData();
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
};

/* ============================================================
 * UI 事件与模态框
 * ============================================================ */
document.querySelectorAll('.close').forEach(b => b.onclick = () => document.getElementById('modal').style.display = 'none');
window.addEventListener('click', e => { if (e.target.classList.contains('modal')) e.target.style.display = 'none'; });

document.querySelectorAll('.left-panel .tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.left-panel .tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.left-panel .tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  };
});
document.querySelectorAll('.right-panel .tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.right-panel .tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.right-panel .tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  };
});

document.getElementById('classSelector').onchange = function() {
  currentClassName = this.options[this.selectedIndex].text;
  currentClassId = this.value;
  loadData();
};

function showModal(title, html) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modal').style.display = 'block';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; }
function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

document.getElementById('themeToggle').onclick = () => {
  currentThemeIndex = (currentThemeIndex + 1) % themes.length;
  document.body.className = themes[currentThemeIndex];
};
